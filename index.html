<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>有給・休暇管理（お試し版）</title>
<style>
:root{
  --main:#315847;--main2:#e4ede8;--main3:#c9dbd1;
  --red:#A33E31;--red2:#f6e4e1;
  --yel:#8B7750;--yel2:#f2ede1;
  --sp:#55607f;--sp2:#e5e8f0;
  --ink:#1f2924;--sub:#5d6862;--line:#dde2df;--bg:#f4f5f3;--card:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:15px;line-height:1.6}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--main)}
.demo{background:#26332d;color:#e8eee9;font-size:13px;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo b{color:#fff;font-weight:600}
.demo select{background:#fff;color:var(--ink);border:0;border-radius:2px;padding:3px 6px}
.demo button{background:transparent;color:#e8eee9;border:1px solid #6d7d75;border-radius:2px;padding:3px 10px;cursor:pointer}
.demo .sp{flex:1}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;color:var(--main)}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--sub);padding:6px 12px;border-radius:2px;font-size:14px}
nav.tabs a.on{background:var(--main);color:#fff}
nav.tabs a .badge{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:16px;margin:26px 0 10px}
.lead{color:var(--sub);margin:0 0 16px;font-size:14px}
.note{font-size:12px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.kpi .v small{font-size:14px;font-weight:400;margin-left:2px}
.kpi.red .v{color:var(--red)} .kpi.ok .v{color:var(--main)} .kpi.yel .v{color:var(--yel)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
th{font-size:12px;color:var(--sub);font-weight:600;background:#fafbfa}
tr.click{cursor:pointer} tr.click:hover td{background:#f7faf8}
td.num,th.num{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex:none}
.who .n{font-weight:600}
.who .t{font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:2px;font-weight:600}
.tag.ok{background:var(--main2);color:var(--main)}
.tag.yel{background:var(--yel2);color:var(--yel)}
.tag.red{background:var(--red2);color:var(--red)}
.tag.gray{background:#eceeed;color:var(--sub)}
.tag.sp{background:var(--sp2);color:var(--sp)}
.bar{width:120px;height:10px;background:#eceeed;border-radius:2px;position:relative;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--main)}
.bar i.p{background:var(--main3)}
.bar.red i:not(.p){background:var(--red)}
.big{font-size:22px;font-weight:700}
.big.red{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.grid2>*{min-width:0}
.side .card{margin-bottom:12px}
.side h3{font-size:14px;margin:0 0 8px}
.btn{display:inline-block;background:var(--main);color:#fff;border:0;border-radius:2px;padding:7px 14px;cursor:pointer;text-decoration:none;font-size:14px}
.btn.sub{background:#fff;color:var(--main);border:1px solid var(--main)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.disclaimer{margin-top:26px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
/* シフト表 */
.shift th,.shift td{padding:0;text-align:center;font-size:12px;min-width:30px;border-right:1px solid var(--line)}
.shift th{padding:4px 0;line-height:1.3}
.shift td.nm,.shift th.nm{position:sticky;left:0;background:#fff;text-align:left;padding:4px 8px;min-width:120px;z-index:1;font-size:13px}
.shift th.nm{background:#fafbfa}
.shift th.sun{color:var(--red)} .shift th.sat{color:#4c6a9a}
.shift th.today{background:var(--main);color:#fff}
.shift td.c{height:32px;cursor:pointer;user-select:none}
.shift td.c:hover{outline:2px solid var(--main);outline-offset:-2px}
.s-日{color:var(--ink)}
.s-公{color:#a3aaa6;background:#f3f4f3}
.s-有{background:var(--main);color:#fff;font-weight:700}
.s-前有,.s-後有{background:var(--main3);color:var(--main);font-weight:700}
.s-特{background:var(--sp);color:#fff;font-weight:700}
.shift td.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{box-shadow:inset 0 0 0 3px #e0a800}100%{box-shadow:none}}
.shift tr.cnt td{font-size:12px;padding:4px 0;background:#fafbfa}
.shift tr.cnt td.short{color:var(--red);font-weight:700;background:var(--red2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0 12px;color:var(--sub)}
.legend span b{display:inline-block;width:26px;text-align:center;border-radius:2px;margin-right:4px;padding:1px 0}
/* 申請 */
.req{border:1px solid var(--line);background:#fff;border-radius:3px;padding:14px;margin-bottom:10px}
.req .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.check{font-size:13px;margin:8px 0;padding:8px 10px;background:#fafbfa;border-radius:2px}
.check div::before{content:"・"}
.check .warn{color:var(--red)}
input[type=text],input[type=date],select.f,textarea{border:1px solid #c8cfcb;border-radius:2px;padding:7px 9px;background:#fff;width:100%}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
/* スマホ */
.phone{max-width:400px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.phone .ph{background:var(--main);color:#fff;padding:14px 18px}
.phone .ph .n{font-size:18px;font-weight:700}
.phone .ph .t{font-size:12px;opacity:.85}
.phone .body{padding:16px 18px 22px}
.hero{text-align:center;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.hero .l{font-size:13px;color:var(--sub)}
.hero .v{font-size:54px;font-weight:700;line-height:1.1;color:var(--main)}
.hero .v.red{color:var(--red)} .hero .v small{font-size:20px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mini div{background:var(--bg);border-radius:3px;padding:10px;text-align:center}
.mini .l{font-size:12px;color:var(--sub)} .mini .v{font-size:22px;font-weight:700}
.bigbtn{display:block;width:100%;padding:14px;font-size:16px;margin-top:14px}
.msg{padding:10px 12px;border-radius:2px;font-size:14px;margin-top:10px}
.msg.ok{background:var(--main2);color:var(--main)} .msg.ng{background:var(--red2);color:var(--red)}
/* 管理簿 */
.ledger-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.basis{background:var(--main2);color:var(--main);padding:8px 12px;border-radius:2px;font-size:14px;margin:10px 0}
.miss{background:var(--red);color:#fff;padding:2px 10px;border-radius:2px;font-size:12px;font-weight:700}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media print{
  .demo,header.top,.noprint{display:none!important}
  body{background:#fff;font-size:12px}
  main{padding:0;max-width:none}
  .wrap,.card{border:1px solid #999}
  th,td{font-size:11px;padding:5px 6px}
}
</style>
</head>
<body>
<div class="demo noprint">
  <span>お試し版</span>
  <span>見る人：</span><select id="viewer"></select>
  <span class="sp"></span>
  <button id="reset">はじめの状態に戻す</button>
</div>
<header class="top noprint" id="hdr"></header>
<main id="app"></main>

<script>
/* ===== 日付のしくみ ===== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return ymd(t)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dow=s=>parse(s).getDay();
const W='日月火水木金土';
const jp=s=>{const d=parse(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'};
const jps=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+W[d.getDay()]+'）'};
const jpy=s=>{const d=parse(s);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const svc=m=>{const y=Math.floor(m/12),r=m%12;return (y?y+'年':'')+(r?r+'か月':'')};

/* 年度（4月〜3月） */
const fyStart=(()=>{const d=parse(TODAY);const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return y+'-04-01'})();
const fyEnd=addDays(addMonths(fyStart,12),-1);

/* ===== 休暇の決まり ===== */
const SPECIAL_DAYS=11;       // 正職員の特別休暇（年度ごと・有給）
const NEED_NURSE=3;          // 1日に必要な看護職の人数（目安）
const LEAVE={'有':1,'前有':.5,'後有':.5};
const NORMAL=[10,11,12,14,16,18,20];
const PROP={4:[7,8,9,10,12,13,15],3:[5,6,6,8,9,10,11],2:[3,4,4,5,6,6,7],1:[1,2,2,2,3,3,3]};
const isProp=st=>st.wd.length<=4&&st.hours<30;
function grantDays(months,st){const i=Math.min(6,Math.floor((months-6)/12));return isProp(st)?PROP[st.wd.length][i]:NORMAL[i]}
function grantBasis(months,st){
  const g=grantDays(months,st);
  return isProp(st)
    ?`勤続${svc(months)}・週${st.wd.length}日（週${st.hours}時間）→ 比例付与で ${g}日`
    :`勤続${svc(months)}・${st.type==='パート'?`週${st.wd.length}日（週${st.hours}時間）→ `:''}通常の付与で ${g}日`;
}

/* ===== 見本の職員（架空） ===== */
const DEF=[
 {id:'s1',name:'山本 花子',role:'管理者・看護師',job:'看護',type:'正職員',wd:[1,2,3,4,5],hours:40,months:138,dl:340,taken:1,planned:2,prev:6,carry0:4,special:3,color:'#315847'},
 {id:'s2',name:'田中 美穂',role:'看護師',job:'看護',type:'正職員',wd:[1,2,3,4,5],hours:40,months:78,dl:45,taken:2,planned:0,prev:5,carry0:2,special:2,color:'#7a5b3e'},
 {id:'s3',name:'鈴木 恵',role:'看護師',job:'看護',type:'正職員',wd:[1,2,3,4,5],hours:40,months:42,dl:105,taken:2,half:2,planned:0,prev:5,carry0:1,special:4,color:'#5b6f8f'},
 {id:'s4',name:'佐々木 健一',role:'理学療法士',job:'リハ',type:'正職員',wd:[1,2,3,4,5],hours:40,months:18,dl:345,taken:0,planned:1,prev:3,carry0:0,special:1,color:'#8a4f55'},
 {id:'s5',name:'高田 由香',role:'作業療法士',job:'リハ',type:'正職員',wd:[1,2,3,4,5],hours:40,months:6,dl:350,taken:0,planned:0,prev:0,carry0:0,special:0,color:'#4f7f74'},
 {id:'s6',name:'木村 直子',role:'事務',job:'事務',type:'正職員',wd:[1,2,3,4,5],hours:40,months:54,dl:200,taken:5,planned:1,prev:6,carry0:2,special:5,color:'#6b6a3c'},
 {id:'p1',name:'井上 和子',role:'看護師',job:'看護',type:'パート',wd:[1,2,3,4],hours:28,months:42,dl:14,taken:4,planned:0,prev:5,carry0:0,color:'#94603a'},
 {id:'p2',name:'松本 さやか',role:'看護師',job:'看護',type:'パート',wd:[1,3,5],hours:18,months:78,dl:120,taken:2,planned:1,prev:5,carry0:1,color:'#5a5d86'},
 {id:'p3',name:'小川 優子',role:'看護師',job:'看護',type:'パート',wd:[2,4],hours:12,months:30,dl:200,taken:1,planned:0,prev:3,carry0:0,color:'#7d6b8c'},
 {id:'p4',name:'西村 真理',role:'理学療法士',job:'リハ',type:'パート',wd:[1,2,4],hours:20,months:30,dl:150,taken:2,planned:0,prev:4,carry0:0,color:'#3f6f8a'},
];

/* ===== 保存（このブラウザの中だけ） ===== */
const KEY='yukyu-kanri-v1';
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.v===1)return o}}catch(e){}return null}

const isWork=(st,d)=>st.wd.includes(dow(d));
const cell=(st,d)=>(S.ov[st.id]&&S.ov[st.id][d])||(isWork(st,d)?'日':'公');
const setCell=(st,d,sym)=>{S.ov[st.id]=S.ov[st.id]||{};const def=isWork(st,d)?'日':'公';if(sym===def)delete S.ov[st.id][d];else S.ov[st.id][d]=sym};
const staffOf=id=>S.staff.find(s=>s.id===id);

function seed(){
  const staff=DEF.map(d=>{
    const nextBase=addDays(TODAY,d.dl+1);          // 期限＝今日からdl日後
    const curBase=addMonths(nextBase,-12);
    const hire=addMonths(curBase,-d.months);
    return {id:d.id,name:d.name,role:d.role,job:d.job,type:d.type,wd:d.wd,hours:d.hours,hire,carry0:d.carry0,color:d.color};
  });
  S={v:1,seededOn:TODAY,staff,ov:{},req:[],viewer:'admin'};
  const free=(st,from,to)=>{const out=[];for(let d=from;d<=to;d=addDays(d,1)){if(isWork(st,d)&&cell(st,d)==='日')out.push(d)}return out};
  const spread=(st,from,to,syms)=>{const days=free(st,from,to);const n=Math.min(syms.length,days.length);for(let i=0;i<n;i++){setCell(st,days[Math.floor((i+.5)*days.length/n)],syms[i])}};
  DEF.forEach((d,i)=>{
    const st=staff[i];const ps=periodsOf(st);const cur=ps[ps.length-1],prev=ps[ps.length-2];
    const syms=[...Array(d.taken).fill('有'),...(d.half?['前有','後有'].slice(0,d.half):[])];
    if(syms.length)spread(st,cur.start,addDays(TODAY,-1),syms);
    if(prev&&d.prev)spread(st,prev.start,prev.end,Array(d.prev).fill('有'));
    if(d.planned)spread(st,addDays(TODAY,3),[cur.end,addDays(TODAY,55)].sort()[0],Array(d.planned).fill('有'));
    if(d.special)spread(st,fyStart,addDays(TODAY,-1),Array(d.special).fill('特'));
  });
  // 見本の申請（申請待ち）
  const s3=staffOf('s3');const w=free(s3,addDays(TODAY,6),addDays(TODAY,30));
  let a=0;while(a<w.length-1&&diff(w[a],w[a+1])!==1)a++;
  S.req.push({id:'r1',sid:'s3',kind:'特',dates:[w[a],w[a+1]],reason:'子どもの学校行事と家族の用事のため',at:addDays(TODAY,-1),state:'待ち'});
  const p2=staffOf('p2');const w2=free(p2,addDays(TODAY,9),addDays(TODAY,40));
  S.req.push({id:'r2',sid:'p2',kind:'有',dates:[w2[0]],reason:'通院のため',at:TODAY,state:'待ち'});
  const s2=staffOf('s2');const w3=free(s2,addDays(TODAY,4),addDays(TODAY,30));
  S.req.push({id:'r3',sid:'s2',kind:'前有',dates:[w3[2]],reason:'',at:addDays(TODAY,-2),state:'待ち'});
  save();
}

/* ===== 計算（基準日・付与・年5日・繰越） ===== */
function periodsOf(st){
  const ps=[];
  for(let k=0;k<60;k++){
    const start=addMonths(st.hire,6+12*k);if(start>TODAY)break;
    ps.push({k,months:6+12*k,start,end:addDays(addMonths(st.hire,18+12*k),-1),grant:grantDays(6+12*k,st)});
  }
  return ps;
}
function usage(st){const o=S.ov[st.id]||{};return Object.keys(o).filter(d=>LEAVE[o[d]]).sort().map(d=>({date:d,sym:o[d],val:LEAVE[o[d]]}))}
const sum=a=>a.reduce((x,u)=>x+u.val,0);
function ledger(st){
  const ps=periodsOf(st);
  if(!ps.length)return{periods:[],cur:null,first:addMonths(st.hire,6)};
  const us=usage(st);const out=[];let carryIn=st.carry0;
  for(let i=Math.max(0,ps.length-2);i<ps.length;i++){
    const p=ps[i];const days=us.filter(u=>u.date>=p.start&&u.date<=p.end);
    const tk=days.filter(u=>u.date<=TODAY),pl=days.filter(u=>u.date>TODAY);
    const used=sum(tk),planned=sum(pl);
    const target=p.grant>=10;
    const lapse=Math.max(0,carryIn-used-planned);           // 繰越分は先に使う → 使い残しは期間の終わりに時効
    const carryOut=Math.max(0,p.grant-Math.max(0,used+planned-carryIn));
    const left=diff(TODAY,p.end);
    let state;
    if(!target)state='out';else if(used>=5)state='ok';else if(p.end<TODAY)state='miss';else if(left<=90)state='red';else state='yel';
    out.push({...p,carryIn,used,planned,remain:carryIn+p.grant-used,remainAfter:carryIn+p.grant-used-planned,lapse,days,target,state,left,need:Math.max(0,5-used),cur:i===ps.length-1});
    carryIn=carryOut;
  }
  return{periods:out,cur:out[out.length-1]};
}
function specialOf(st){
  if(st.type!=='正職員')return null;
  const o=S.ov[st.id]||{};const ds=Object.keys(o).filter(d=>o[d]==='特'&&d>=fyStart&&d<=fyEnd).sort();
  return{days:ds,used:ds.filter(d=>d<=TODAY).length,planned:ds.filter(d=>d>TODAY).length,remain:SPECIAL_DAYS-ds.length};
}
function nurseCount(d){let n=0;S.staff.forEach(st=>{if(st.job!=='看護')return;const c=cell(st,d);if(c==='日')n+=1;else if(c==='前有'||c==='後有')n+=.5});return n}

const STATE={ok:['届いた','ok'],yel:['足りない','yel'],red:['足りない・期限が近い','red'],miss:['期限を過ぎて届かなかった','red'],out:['対象外','gray']};
const av=st=>`<span class="av" style="background:${st.color}">${esc(st.name[0])}</span>`;
const workText=st=>st.type==='正職員'?'正職員':`パート 週${st.wd.length}日・${st.hours}時間`;
const who=st=>`<div class="who">${av(st)}<div><div class="n">${esc(st.name)}</div><div class="t">${esc(st.role)}／${workText(st)}</div></div></div>`;
const KIND={'有':'有給（全日）','前有':'有給（前半の半日）','後有':'有給（後半の半日）','特':'特別休暇'};

/* ===== 画面：管理者 ===== */
function header(){
  const h=document.getElementById('hdr');

function pageLedger(id){

  const sel=`<select class="f noprint" style="width:auto" onchange="location.hash='#/staff/'+this.value">${S.staff.map(s=>`<option value="${s.id}" ${s.id===st.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
  let h=`<div class="ledger-h"><div><h1>年次有給休暇管理簿</h1><div class="row" style="margin-top:8px">${who(st)}<span class="note">入社日 ${jp(st.hire)}</span></div></div>
   <div class="row noprint">${sel}<button class="btn sub" onclick="window.print()">印刷する</button><button class="btn" onclick="csvLedger('${st.id}')">CSVで書き出す（Excel）</button></div></div>`;
  if(!L.cur){return h+`<div class="card" style="margin-top:16px">まだ有給は付与されていません。最初の基準日は <b>${jp(L.first)}</b> です（入社から6か月後）。</div>`}
  [...L.periods].reverse().forEach(p=>{
    const [lab,cls]=STATE[p.state];
    h+=`<h2>${p.cur?'今の期間':'前の期間'}：${jp(p.start)} 〜 ${jp(p.end)} ${p.state==='miss'?'<span class="miss">期限を過ぎて5日に届かなかった</span>':''}</h2>
    <div class="basis">基準日 ${jp(p.start)}　付与 ${p.grant}日（${grantBasis(p.months,st)}）</div>
    <div class="wrap"><table>
     <tr><th>基準日</th><th class="num">付与</th><th class="num">繰越</th><th class="num">取得</th>${p.cur?'<th class="num">予定</th>':''}<th class="num">残り</th><th class="num">時効になる見込み</th><th>年5日</th></tr>
     <tr><td>${jpy(p.start)}</td><td class="num">${p.grant}日</td><td class="num">${fmt(p.carryIn)}日</td><td class="num">${fmt(p.used)}日</td>${p.cur?`<td class="num">${fmt(p.planned)}日</td>`:''}
      <td class="num"><b>${fmt(p.remain)}日</b></td><td class="num">${p.lapse?fmt(p.lapse)+'日（'+jpy(p.end)+'）':'―'}</td>
      <td><span class="tag ${cls}">${lab}</span>${p.target&&p.state!=='ok'&&p.cur?` あと${fmt(p.need)}日・期限まで${p.left}日`:''}</td></tr>
    </table></div>
    <h2 style="font-size:14px;margin-top:14px">取得した日（シフト表から）</h2>
    <div class="wrap"><table><tr><th>日付</th><th>区分</th><th class="num">日数</th><th>取得／予定</th><th class="noprint"></th></tr>
     ${p.days.length?p.days.map(u=>`<tr><td>${jp(u.date)}（${W[dow(u.date)]}）</td><td>${u.sym==='有'?'全日':u.sym==='前有'?'半日（前半）':'半日（後半）'}</td><td class="num">${fmt(u.val)}日</td><td>${u.date<=TODAY?'取得':'<span class="tag gray">予定</span>'}</td>
      <td class="noprint">${u.date>=addMonths(TODAY,-12).slice(0,8)+'01'?`<a href="#/shift?m=${u.date.slice(0,7)}&d=${u.date}&s=${st.id}">シフト表で見る</a>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="note">まだありません</td></tr>'}

function csvLedger(id){
  const st=staffOf(id);const L=ledger(st);
  const rows=[['年次有給休暇管理簿'],['氏名',st.name],['職種',st.role],['働き方',workText(st)],['入社日',st.hire],[]];
  L.periods.forEach(p=>{
    rows.push(['期間',p.start+'〜'+p.end],['基準日',p.start],['付与日数',p.grant,grantBasis(p.months,st)],['繰越',p.carryIn],['取得',p.used],['残り',p.remain],['年5日',STATE[p.state][0]]);
    rows.push(['取得日','区分','日数','取得/予定']);
    p.days.forEach(u=>rows.push([u.date,u.sym==='有'?'全日':'半日',u.val,u.date<=TODAY?'取得':'予定']));rows.push([]);
  });
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`年次有給休暇管理簿_${st.name.replace(' ','')}_${TODAY}.csv`;a.click();
}

function pageShift(q){
  const minM=addMonths(TODAY,-12).slice(0,7),maxM=addMonths(TODAY,2).slice(0,7);
  let m=q.get('m')||TODAY.slice(0,7);if(m<minM)m=minM;if(m>maxM)m=maxM;
  const first=m+'-01';const n=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const days=[...Array(n)].map((_,i)=>addDays(first,i));
  const prev=addMonths(first,-1).slice(0,7),next=addMonths(first,1).slice(0,7);
  const [y,mm]=m.split('-').map(Number);
  return `<h1>シフト表</h1>
  <p class="lead">マスを押すと記号が「日 → 有 → 前有 → 後有 → 特 → 公」の順に変わります。休暇の記号は、管理簿と年5日の取得状況にその場で反映されます。</p>
  <div class="row" style="margin-bottom:6px">
   <a class="btn sub sm" href="#/shift?m=${prev}" ${m<=minM?'style="visibility:hidden"':''}>‹ 前の月</a>
   <b style="font-size:17px">${y}年${mm}月</b>
   <a class="btn sub sm" href="#/shift?m=${next}" ${m>=maxM?'style="visibility:hidden"':''}>次の月 ›</a>
   <a class="btn sub sm" href="#/shift">今月</a>
  </div>
  <div class="legend"><span><b class="s-日">日</b>日勤</span><span><b class="s-公">公</b>公休</span><span><b class="s-有">有</b>有給</span><span><b class="s-前有">前有</b><b class="s-後有">後有</b>有給の半日</span><span><b class="s-特">特</b>特別休暇（正職員のみ）</span></div>
  <div class="wrap"><table class="shift">
   <tr><th class="nm">職員</th>${days.map(d=>{const w=dow(d);return `<th class="${w===0?'sun':w===6?'sat':''} ${d===TODAY?'today':''}">${+d.slice(8)}<br>${W[w]}</th>`}).join('')}</tr>
   ${S.staff.map(st=>`<tr><td class="nm"><b>${esc(st.name)}</b><br><span class="note">${esc(st.role)}${st.type==='パート'?'・パート':''}</span></td>${days.map(d=>{const c=cell(st,d);return `<td class="c s-${c}" data-s="${st.id}" data-d="${d}">${c}</td>`}).join('')}</tr>`).join('')}
   <tr class="cnt"><td class="nm">看護職の人数<br><span class="note">必要 ${NEED_NURSE}名</span></td>${days.map(d=>{const w=dow(d);if(w===0||w===6)return '<td>―</td>';const c=nurseCount(d);return `<td class="${c<NEED_NURSE?'short':''}">${fmt(c)}</td>`}).join('')}</tr>
  </table></div>
  <p class="note">土日は営業日外としています（お試し版の設定）。看護職の人数が必要人数を下回る日は赤で示します。</p>`;
}
function cycleCell(sid,d){
  const st=staffOf(sid);const order=st.type==='正職員'?['日','有','前有','後有','特','公']:['日','有','前有','後有','公'];
  const c=cell(st,d);let nx=order[(order.indexOf(c)+1)%order.length];
  if(nx==='特'){const sp=specialOf(st);if(sp.remain<=0&&!(d>=fyStart&&d<=fyEnd&&c==='特'))nx='公'}
  setCell(st,d,nx);save();
}

function reqCheck(q){
  const st=staffOf(q.sid);const out=[];
  q.dates.forEach(d=>{
    if(!isWork(st,d))out.push(['warn',`${jps(d)} はもともと勤務の日ではありません`]);
    else if(LEAVE[cell(st,d)]||cell(st,d)==='特')out.push(['warn',`${jps(d)} はすでに休みが入っています`]);
    if(st.job==='看護'){const c=nurseCount(d)-1;out.push([c<NEED_NURSE?'warn':'',`${jps(d)} この人が休むと看護職は ${fmt(c)}名（必要 ${NEED_NURSE}名）`])}
  });
  if(q.kind==='特'){const sp=specialOf(st);out.push([sp.remain<q.dates.length?'warn':'',`特別休暇の残り ${sp.remain}日 → 承認すると ${sp.remain-q.dates.length}日。年5日には数えません`])}
  else{const c=ledger(st).cur;if(c){const v=LEAVE[q.kind]*q.dates.length;out.push([c.remainAfter<v?'warn':'',`有給の残り ${fmt(c.remainAfter)}日（予定を引いた後）`]);if(c.target&&c.state!=='ok')out.push(['',`年5日まで あと${fmt(c.need)}日 → 承認すると年5日に ${fmt(v)}日 数えられます`])}}
  return out;
}
function pageRequests(){
  const pend=S.req.filter(q=>q.state==='待ち'),done=S.req.filter(q=>q.state!=='待ち');
  const card=q=>{const st=staffOf(q.sid);return `<div class="req"><div class="h">${who(st)}<div class="note">申請日 ${jpy(q.at)}</div></div>
   <div style="margin-top:8px"><span class="tag ${q.kind==='特'?'sp':'ok'}">${KIND[q.kind]}</span>　<b>${q.dates.map(jps).join('・')}</b>（${fmt(q.dates.length*(q.kind==='特'?1:LEAVE[q.kind]))}日）</div>
   ${q.reason?`<div class="note">理由：${esc(q.reason)}</div>`:''}
   ${q.state==='待ち'?`<div class="check"><b style="font-size:12px">確かめておくこと</b>${reqCheck(q).map(([c,t])=>`<div class="${c}">${t}</div>`).join('')}</div>
   <div class="row"><button class="btn" onclick="approve('${q.id}')">承認する</button><input type="text" id="rs-${q.id}" placeholder="差し戻す理由（例：この日は人数が足りないため）" style="max-width:340px"><button class="btn red" onclick="reject('${q.id}')">差し戻す</button></div>`
   :`<div style="margin-top:6px"><span class="tag ${q.state==='承認'?'ok':'red'}">${q.state}</span> ${q.note?'<span class="note">理由：'+esc(q.note)+'</span>':''}</div>`}</div>`};
  return `<h1>申請</h1><p class="lead">職員のスマホから届いた休みの申請です。承認すると、シフト表にその場で記号が入ります。</p>
  <h2>申請待ち（${pend.length}件）</h2>${pend.map(card).join('')||'<p class="note">ありません</p>'}
  <h2>決めた申請</h2>${done.slice().reverse().map(card).join('')||'<p class="note">ありません</p>'}`;
}
function approve(id){const q=S.req.find(r=>r.id===id);const st=staffOf(q.sid);q.dates.forEach(d=>{const c=cell(st,d);if(c==='日')setCell(st,d,q.kind)});q.state='承認';save();render()}
function reject(id){const q=S.req.find(r=>r.id===id);const v=document.getElementById('rs-'+id).value.trim();if(!v){alert('差し戻す理由を入れてください');return}q.state='差し戻し';q.note=v;save();render()}

   <div class="mini">
    <div><div class="l">有給の残り</div><div class="v">${c?fmt(c.remain):'―'}<small style="font-size:13px">日</small></div></div>
    <div><div class="l">${sp?'特別休暇の残り':'次の休み'}</div><div class="v" style="${sp?'':'font-size:16px'}">${sp?sp.remain+'<small style="font-size:13px">日</small>':(next?jps(next):'―')}</div></div>
   </div>
   ${sp?`<div class="note">次の休み：${next?jps(next)+'（'+KIND[o[next]]+'）':'まだ入っていません'}</div>`:''}
   <h2 style="margin-top:18px">休みを申請する</h2>
   <label class="f">種類</label><select class="f" id="ak">${kinds.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
   <label class="f">日付（勤務の日だけ選べます）</label><input type="date" id="ad" min="${addDays(TODAY,1)}" max="${addDays(TODAY,60)}">
   <div id="spn" style="display:none"><label class="f">日数（続けて取る日数）</label><select class="f" id="an">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div>
   <label class="f">理由（任意）</label><input type="text" id="ar" placeholder="例：通院のため">
   <button class="btn bigbtn" onclick="apply()">申請を送る</button>
   <div id="amsg"></div>
   <h2>自分の申請</h2>
   ${mine.map(q=>`<div class="req" style="padding:10px"><span class="tag ${q.kind==='特'?'sp':'ok'}">${KIND[q.kind]}</span> ${q.dates.map(jps).join('・')}<br>
     <span class="tag ${q.state==='承認'?'ok':q.state==='待ち'?'gray':'red'}">${q.state==='待ち'?'承認待ち':q.state}</span> ${q.note?'<span class="note">'+esc(q.note)+'</span>':''}</div>`).join('')||'<p class="note">まだありません</p>'}
  </div></div>
  <p class="note" style="text-align:center;margin-top:12px">※ お試し版では、上の「見る人」で職員を切り替えると、その人のスマホ画面になります。</p>`;
}
function apply(){
  const st=staffOf(S.viewer);const k=document.getElementById('ak').value,d=document.getElementById('ad').value,r=document.getElementById('ar').value.trim();
  const m=document.getElementById('amsg');const ng=t=>m.innerHTML=`<div class="msg ng">${t}</div>`;
  if(!d)return ng('日付を選んでください');
  if(!isWork(st,d))return ng(`${jps(d)} は勤務の日ではありません`);
  let dates=[d];
  if(k==='特'){const n=+document.getElementById('an').value;dates=[];let x=d;while(dates.length<n&&diff(d,x)<30){if(isWork(st,x))dates.push(x);x=addDays(x,1)}
    const sp=specialOf(st);if(sp.remain<n)return ng(`特別休暇の残りは ${sp.remain}日 です`)}
  const busy=dates.filter(x=>cell(st,x)!=='日'||S.req.some(q=>q.sid===st.id&&q.state==='待ち'&&q.dates.includes(x)));
  if(busy.length)return ng(`${busy.map(jps).join('・')} はすでに休みか申請中です`);
  S.req.push({id:'r'+Date.now(),sid:st.id,kind:k,dates,reason:r,at:TODAY,state:'待ち'});save();render();
  document.getElementById('amsg').innerHTML=`<div class="msg ok">申請を送りました（${dates.map(jps).join('・')}）。管理者の承認を待ちます。</div>`;
}

/* ===== 切り替え ===== */
function render(){
  header();
  const app=document.getElementById('app');
  const [path,qs]=(location.hash.slice(1)||'/').split('?');const q=new URLSearchParams(qs||'');
  if(S.viewer!=='admin'){app.innerHTML=pageMe();const ak=document.getElementById('ak');ak.onchange=()=>document.getElementById('spn').style.display=ak.value==='特'?'block':'none';return}
  if(path.startsWith('/staff/'))app.innerHTML=pageLedger(path.slice(7));
  else if(path==='/staff')app.innerHTML=pageLedgerList();
  else if(path==='/shift'){app.innerHTML=pageShift(q);const d=q.get('d'),s=q.get('s');if(d&&s){const el=app.querySelector(`td[data-s="${s}"][data-d="${d}"]`);if(el){el.classList.add('flash');el.scrollIntoView({block:'nearest',inline:'center'})}}}
  else if(path==='/special')app.innerHTML=pageSpecial();
  else if(path==='/requests')app.innerHTML=pageRequests();
  else app.innerHTML=pageStatus();
}
document.getElementById('app').addEventListener('click',e=>{const td=e.target.closest('td.c');if(!td)return;cycleCell(td.dataset.s,td.dataset.d);const st=staffOf(td.dataset.s);const c=cell(st,td.dataset.d);td.className='c s-'+c;td.textContent=c;
  // 人数の行を更新
  const row=td.closest('table').querySelector('tr.cnt');const idx=[...td.parentNode.children].indexOf(td);const ct=row.children[idx];const w=dow(td.dataset.d);if(w!==0&&w!==6){const n=nurseCount(td.dataset.d);ct.textContent=fmt(n);ct.className=n<NEED_NURSE?'short':''}});
function fillViewer(){
  const v=document.getElementById('viewer');
  v.innerHTML=`<option value="admin">管理者（パソコンの画面）</option><optgroup label="職員のスマホ">${S.staff.map(s=>`<option value="${s.id}">${esc(s.name)}（${s.type}）</option>`).join('')}</optgroup>`;
  v.value=S.viewer;
}
document.getElementById('viewer').onchange=e=>{S.viewer=e.target.value;save();location.hash=S.viewer==='admin'?'#/':'#/me';render()};
document.getElementById('reset').onclick=()=>{if(confirm('見本のはじめの状態に戻します。よろしいですか？')){seed();fillViewer();location.hash='#/';render()}};
window.addEventListener('hashchange',render);

S=load();if(!S)seed();
fillViewer();render();
</script>
</body>
</html>
